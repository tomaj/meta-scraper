ll="#94a3b8" text-anchor="middle">pevná IP, timeouty</text><path d="M456 80c0-40-70-48-104-48c-30 0-60 10-94 46" stroke="#fbbf24" stroke-width="2" fill="none" stroke-dasharray="5 5" marker-end="url(#arrow)"/><text x="372" y="26" font-family="Inter, ui-sans-serif, system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="11.5" fill="#94a3b8" text-anchor="middle">každý cieľ presmerovania sa overí znova</text><path d="M536 122h34" stroke="#2dd4bf" stroke-width="2" fill="none" marker-end="url(#arrow)"/><rect x="574" y="80" width="100" height="84" rx="12" fill="#134e4a" stroke="#2dd4bf" stroke-width="1.5"/><text x="624.0" y="119.0" font-family="Inter, ui-sans-serif, system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="14" font-weight="700" fill="#2dd4bf" text-anchor="middle">Meta</text><text x="624.0" y="137.0" font-family="Inter, ui-sans-serif, system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="11.5" fill="#94a3b8" text-anchor="middle">nedôveryhodné</text><path d="M674 122h30" stroke="#2dd4bf" stroke-width="2" fill="none" marker-end="url(#arrow)"/><rect x="708" y="80" width="96" height="84" rx="12" fill="#134e4a" stroke="#2dd4bf" stroke-width="1.5"/><text x="756.0" y="119.0" font-family="Inter, ui-sans-serif, system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="14" font-weight="700" fill="#2dd4bf" text-anchor="middle">karta</text><text x="756.0" y="137.0" font-family="Inter, ui-sans-serif, system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="11.5" fill="#94a3b8" text-anchor="middle">escapované</text>
