<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 250" width="820" height="250" role="img" aria-label="A pasted URL is checked by the URL guard: scheme, resolved address, private ranges. Blocked URLs stop there. Allowed URLs are fetched pinned to the checked address, every redirect target is checked again, then the parsed values are escaped into a preview card">
  <defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M1 1l8 4-8 4z" fill="#0f766e"/></marker></defs>
  <rect width="820" height="250" rx="16" fill="#f8fafc"/>
  <rect x="20" y="90" width="120" height="64" rx="12" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/><text x="80.0" y="119.0" font-family="Inter, ui-sans-serif, system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="14" font-weight="700" fill="#0f172a" text-anchor="middle">pasted URL</text><text x="80.0" y="137.0" font-family="Inter, ui-sans-serif, system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="11.5" fill="#64748b" text-anchor="middle">from a user</text><path d="M140 122h34" stroke="#0f766e" stroke-width="2" fill="none" marker-end="url(#arrow)"/><rect x="178" y="80" width="160" height="84" rx="12" fill="#ccfbf1" stroke="#0f766e" stroke-width="1.5"/><text x="258.0" y="119.0" font-family="Inter, ui-sans-serif, system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="14" font-weight="700" fill="#0f766e" text-anchor="middle">UrlGuard</text><text x="258.0" y="137.0" font-family="Inter, ui-sans-serif, system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="11.5" fill="#64748b" text-anchor="middle">scheme, DNS, private IP</text><path d="M258 164v34" stroke="#0f766e" stroke-width="2" fill="none" marker-end="url(#arrow)"/><rect x="178" y="200" width="160" height="40" rx="12" fill="#fee2e2" stroke="#dc2626" stroke-width="1.5"/><text x="258.0" y="225.0" font-family="Inter, ui-sans-serif, system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="14" font-weight="700" fill="#dc2626" text-anchor="middle">blocked</text><path d="M338 122h34" stroke="#0f766e" stroke-width="2" fill="none" marker-end="url(#arrow)"/><rect x="376" y="80" width="160" height="84" rx="12" fill="#ccfbf1" stroke="#0f766e" stroke-width="1.5"/><text x="456.0" y="119.0" font-family="Inter, ui-sans-serif, system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="14" font-weight="700" fill="#0f766e" text-anchor="middle">parseUrl()</text><text x="456.0" y="137.0" font-family="Inter, ui-sans-serif, system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="11.5" fill="#64748b" text-anchor="middle">pinned IP, timeouts</text><path d="M456 80c0-40-70-48-104-48c-30 0-60 10-94 46" stroke="#d97706" stroke-width="2" fill="none" stroke-dasharray="5 5" marker-end="url(#arrow)"/><text x="372" y="26" font-family="Inter, ui-sans-serif, system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="11.5" fill="#64748b" text-anchor="middle">every redirect target is checked again</text><path d="M536 122h34" stroke="#0f766e" stroke-width="2" fill="none" marker-end="url(#arrow)"/><rect x="574" y="80" width="100" height="84" rx="12" fill="#ccfbf1" stroke="#0f766e" stroke-width="1.5"/><text x="624.0" y="119.0" font-family="Inter, ui-sans-serif, system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="14" font-weight="700" fill="#0f766e" text-anchor="middle">Meta</text><text x="624.0" y="137.0" font-family="Inter, ui-sans-serif, system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="11.5" fill="#64748b" text-anchor="middle">untrusted</text><path d="M674 122h30" stroke="#0f766e" stroke-width="2" fill="none" marker-end="url(#arrow)"/><rect x="708" y="80" width="96" height="84" rx="12" fill="#ccfbf1" stroke="#0f766e" stroke-width="1.5"/><text x="756.0" y="119.0" font-family="Inter, ui-sans-serif, system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="14" font-weight="700" fill="#0f766e" text-anchor="middle">card</text><text x="756.0" y="137.0" font-family="Inter, ui-sans-serif, system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="11.5" fill="#64748b" text-anchor="middle">escaped</text>
</svg>
